# The package's own DDEV project — the gate's package shape. A worktree overrides `name:` in
# .ddev/config.local.yaml (gitignored); config.gates.yaml and config.package.yaml merge in.
name: {{PACKAGE}}
type: wordpress
docroot: web
php_version: "8.3"
webserver_type: nginx-fpm
database:
    type: mariadb
    version: "11.8"
nodejs_version: "24"
disable_settings_management: true
